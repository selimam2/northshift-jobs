services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: northshift
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=northshift;Username=postgres;Password=postgres"
      Jwt__Key: "local-dev-secret-change-in-production-must-be-long"
      Jwt__Issuer: northshift-api
      Jwt__Audience: northshift-client
      Jwt__ExpiryHours: "24"
      Stripe__SecretKey: sk_test_REPLACE_ME
      Stripe__WebhookSecret: whsec_REPLACE_ME
      Resend__ApiKey: re_REPLACE_ME
      Resend__FromEmail: jobs@northshiftjobs.ca
      Resend__FromName: NorthShift Jobs
      Frontend__Url: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
